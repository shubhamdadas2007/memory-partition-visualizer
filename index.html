<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MEMORYMAP PRO // Main Memory Allocation & Fragmentation Laboratory</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    :root {
      --bg-dark: #070c18;
      --bg-card: #0f172a;
      --border-color: #1e293b;
      --primary-cyan: #06b6d4;
      --primary-indigo: #6366f1;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --accent-emerald: #10b981;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .font-mono { font-family: 'Fira Code', monospace; }

    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    /* Header */
    header {
      background-color: #0f172a;
      border-bottom: 1px solid #1e293b;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
    }
    .top-bar {
      background-color: #020617;
      border-bottom: 1px solid #1e293b;
      padding: 6px 24px;
      font-size: 11px;
      color: var(--primary-cyan);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%; background-color: var(--accent-emerald);
      display: inline-block; animation: pulse 2s infinite;
      box-shadow: 0 0 8px var(--accent-emerald);
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .main-header {
      padding: 14px 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .logo-area { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .logo-icon {
      width: 44px; height: 44px; border-radius: 12px;
      background: linear-gradient(135deg, var(--primary-cyan), var(--primary-indigo));
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 14px; color: white;
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
    }
    .logo-title { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; }
    .badge-tag {
      font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 9999px;
      background: rgba(6, 182, 212, 0.1); border: 1px solid rgba(6, 182, 212, 0.3); color: var(--primary-cyan);
    }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .btn {
      padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 700;
      border: 1px solid #334155; background-color: #1e293b; color: #f8fafc;
      cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px;
      font-family: inherit;
    }
    .btn:hover { background-color: #334155; border-color: #475569; }
    .btn-accent {
      background: linear-gradient(135deg, var(--accent-amber), #ea580c);
      color: #020617; border: none; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
    }
    .btn-accent:hover { filter: brightness(1.1); }
    .btn-cyan {
      background: linear-gradient(135deg, var(--primary-cyan), var(--primary-indigo));
      color: white; border: none; box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
    }
    .btn-cyan:hover { filter: brightness(1.15); transform: translateY(-1px); }
    .btn-emerald {
      background: linear-gradient(135deg, var(--accent-emerald), #059669);
      color: #020617; border: none; font-weight: 800; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }
    .btn-emerald:hover { filter: brightness(1.1); }
    .btn-sm { padding: 4px 10px; font-size: 11px; }

    /* Nav Tabs */
    .nav-tabs {
      background-color: rgba(2, 6, 23, 0.6);
      border-top: 1px solid #1e293b;
      padding: 0 24px;
      display: flex;
      gap: 4px;
      overflow-x: auto;
    }
    .tab-btn {
      padding: 10px 16px; font-size: 12px; font-weight: 700; color: #94a3b8;
      background: transparent; border: none; border-bottom: 2px solid transparent;
      cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.5px;
      white-space: nowrap; font-family: inherit;
    }
    .tab-btn:hover { color: #f8fafc; }
    .tab-btn.active { color: var(--primary-cyan); border-bottom-color: var(--primary-cyan); background-color: #0f172a; border-radius: 8px 8px 0 0; }

    /* Layout & Cards */
    main { flex: 1; padding: 24px; max-width: 1400px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
    .card {
      background-color: rgba(15, 23, 42, 0.9);
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
      display: flex; flex-direction: column; gap: 16px;
    }
    .card-title {
      font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;
      border-bottom: 1px solid #1e293b; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 8px;
    }

    .grid-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .metric-box {
      background-color: #020617; border: 1px solid #1e293b; border-radius: 12px; padding: 14px;
      display: flex; flex-direction: column; gap: 4px; position: relative;
    }
    .metric-label { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .metric-val { font-size: 22px; font-weight: 800; font-family: 'Fira Code', monospace; }
    .metric-sub { font-size: 10px; color: var(--text-muted); }

    .grid-dashboard { display: grid; grid-template-columns: 360px 1fr; gap: 24px; }
    @media (max-width: 1024px) { .grid-dashboard { grid-template-columns: 1fr; } }

    /* Form Controls */
    label { font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; display: block; }
    input, select {
      width: 100%; background-color: #020617; border: 1px solid #334155; border-radius: 10px;
      padding: 8px 12px; font-size: 12px; color: white; font-family: 'Fira Code', monospace; outline: none;
    }
    input:focus, select:focus { border-color: var(--primary-cyan); }

    /* Memory Track Bar */
    .track-wrapper { display: flex; flex-direction: column; gap: 8px; padding: 0 8px; }
    .ruler { height: 26px; position: relative; border-bottom: 1px solid #1e293b; font-size: 9px; color: #64748b; font-family: 'Fira Code', monospace; }
    .ruler-tick { position: absolute; top: 0; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; white-space: nowrap; }
    .ruler-tick-line { width: 1px; height: 6px; background-color: #334155; margin-top: 2px; }

    .track-container {
      height: 140px; background-color: #020617; border-radius: 14px; border: 1px solid #1e293b;
      display: flex; overflow: hidden; position: relative; box-shadow: inset 0 2px 10px rgba(0,0,0,0.8);
    }
    .block-segment {
      height: 100%; padding: 8px; font-family: 'Fira Code', monospace; display: flex; flex-direction: column; justify-content: space-between;
      cursor: pointer; transition: all 0.2s; user-select: none; border-right: 1px solid rgba(255,255,255,0.15); position: relative;
      overflow: hidden;
    }
    .block-segment:hover { filter: brightness(1.25); z-index: 5; }
    .block-os { background-color: #1e293b; color: var(--primary-cyan); font-weight: 800; border-right: 2px solid #475569; }
    .block-alloc { background: linear-gradient(135deg, #0e7490, #4338ca); color: white; font-weight: 800; }
    .block-free { background-color: rgba(2, 6, 23, 0.85); color: #94a3b8; border-right: 1px dashed #334155; }
    .block-free.alert { background-color: rgba(244, 63, 94, 0.15); border: 2px dashed var(--accent-rose); animation: pulse 1.5s infinite; }
    
    .frag-overlay {
      position: absolute; top: 0; right: 0; bottom: 0; background: repeating-linear-gradient(45deg, rgba(245, 158, 11, 0.2), rgba(245, 158, 11, 0.2) 6px, rgba(245, 158, 11, 0.4) 6px, rgba(245, 158, 11, 0.4) 12px);
      border-left: 2px dashed var(--accent-amber); display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 800; color: #fef08a; padding: 2px 4px;
    }

    .cursor-line {
      position: absolute; top: 0; bottom: 0; width: 4px; background-color: var(--accent-amber);
      box-shadow: 0 0 12px var(--accent-amber); z-index: 20; pointer-events: none; transition: left 0.3s ease;
    }

    /* Alert Banner */
    .alert-banner {
      background: linear-gradient(90deg, rgba(136, 19, 55, 0.6), rgba(153, 27, 27, 0.8), rgba(136, 19, 55, 0.6));
      border: 1px solid var(--accent-rose); border-radius: 12px; padding: 14px 18px; color: #fecdd3; font-size: 12px;
      display: flex; justify-content: space-between; align-items: center; gap: 14px; animation: pulse 2s infinite;
    }
    .stale-banner {
      background: linear-gradient(90deg, rgba(120, 53, 15, 0.7), rgba(180, 83, 9, 0.8), rgba(120, 53, 15, 0.7));
      border: 1px solid var(--accent-amber); border-radius: 12px; padding: 12px 16px; color: #fef3c7; font-size: 12px;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }

    /* Academic Note Box */
    .academic-note {
      background-color: rgba(2, 6, 23, 0.8); border: 1px solid rgba(6, 182, 212, 0.3);
      border-radius: 10px; padding: 10px 14px; font-size: 11px; color: #cbd5e1;
      display: flex; align-items: center; gap: 8px; line-height: 1.4;
    }

    /* 64 Block Grid */
    .block-grid { display: grid; grid-template-columns: repeat(16, 1fr); gap: 4px; font-family: 'Fira Code', monospace; font-size: 9px; }
    @media (max-width: 768px) { .block-grid { grid-template-columns: repeat(8, 1fr); } }
    .grid-cell {
      height: 38px; border-radius: 6px; border: 1px solid #1e293b; background-color: #020617;
      display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s;
      position: relative;
    }
    .grid-cell:hover { border-color: var(--primary-cyan); z-index: 2; transform: scale(1.05); }
    .grid-cell.cell-os { background-color: #1e293b; color: var(--primary-cyan); font-weight: 700; }
    .grid-cell.cell-alloc { background: linear-gradient(135deg, #0e7490, #4338ca); color: white; font-weight: 700; }

    /* Tables */
    table { width: 100%; border-collapse: collapse; font-family: 'Fira Code', monospace; font-size: 11px; text-align: left; }
    th { padding: 10px; border-bottom: 1px solid #1e293b; color: var(--text-muted); text-transform: uppercase; font-size: 10px; }
    td { padding: 10px; border-bottom: 1px solid #0f172a; }
    tr:hover td { background-color: rgba(30, 41, 59, 0.4); }

    /* Console Log */
    .console-log {
      background-color: #020617; border: 1px solid #1e293b; border-radius: 12px; padding: 12px;
      font-family: 'Fira Code', monospace; font-size: 11px; height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px;
    }

    /* Benchmark Specific Styles */
    .benchmark-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .benchmark-card {
      background-color: #020617; border: 1px solid #1e293b; border-radius: 12px; padding: 14px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .benchmark-track {
      height: 60px; background-color: #0f172a; border-radius: 8px; border: 1px solid #1e293b;
      display: flex; overflow: hidden; position: relative;
    }
    .badge-winner {
      background: rgba(16, 185, 129, 0.15); border: 1px solid var(--accent-emerald);
      color: var(--accent-emerald); padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: 700;
    }
    .chart-bar-container { display: flex; flex-direction: column; gap: 8px; }
    .chart-row { display: flex; align-items: center; gap: 8px; font-size: 11px; font-family: 'Fira Code', monospace; }
    .chart-label { width: 90px; color: var(--text-muted); text-align: right; }
    .chart-bar-bg { flex: 1; height: 16px; background: #0f172a; border-radius: 4px; overflow: hidden; position: relative; }
    .chart-bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease; }
    .chart-val { width: 60px; font-weight: 700; text-align: left; }

    /* Print / Lab Report Styles */
    @media print {
      body { background: white; color: black; font-size: 10pt; }
      header, .nav-tabs, .btn, .btn-group, select, input, .console-log, button { display: none !important; }
      .card { border: 1px solid #ccc; box-shadow: none; page-break-inside: avoid; margin-bottom: 20px; }
      .track-container { border: 1px solid #000; }
      table { border: 1px solid #000; }
      th, td { border: 1px solid #ccc; color: black !important; }
      .print-header { display: block !important; margin-bottom: 20px; border-bottom: 2px solid black; padding-bottom: 10px; }
    }
    .print-header { display: none; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="top-bar">
      <div>
        <span class="status-dot"></span>
        <strong style="margin-left: 6px; color: var(--accent-emerald);">OS KERNEL ACTIVE</strong>
        <span style="color: #334155; margin: 0 8px;">|</span>
        <span>CONTIGUOUS PHYSICAL MEMORY SIMULATOR</span>
      </div>
      <div>
        <span>SIMULATION SPACE: 0 KB — 1024 KB</span>
        <span style="color: #64748b; margin-left: 6px;">[Display: 0x0000 — 0x0400]</span>
        <span style="color: #334155; margin: 0 8px;">|</span>
        <strong style="color: var(--accent-amber);">ACADEMIC EVALUATION READY</strong>
      </div>
    </div>

    <div class="main-header">
      <div class="logo-area" onclick="switchTab('simulator')">
        <div class="logo-icon">RAM</div>
        <div>
          <div class="logo-title">
            MEMORYMAP PRO
            <span class="badge-tag">OS LABORATORY</span>
          </div>
          <p style="font-size: 11px; color: var(--text-muted);">Main Memory Contiguous Allocation, Fragmentation & Compaction Laboratory</p>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-cyan" id="btn-header-benchmark" onclick="runBenchmarkFromHeader()" title="Execute 4-Algorithm Benchmark">
          ⚡ Run Benchmark
        </button>
        <button class="btn" onclick="triggerRandomScenario()">↻ Random Scenario</button>
        <button class="btn btn-accent" onclick="toggleDemoMode()">✨ Demo Mode</button>
        <button class="btn" onclick="exportLabReport()">📄 Lab Report</button>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
      <button class="tab-btn active" id="tab-btn-simulator" onclick="switchTab('simulator')">Simulator Arena</button>
      <button class="tab-btn" id="tab-btn-benchmark" onclick="switchTab('benchmark')">4-Algorithm Benchmark</button>
      <button class="tab-btn" id="tab-btn-experiments" onclick="switchTab('experiments')">Experiment Mode (7 Labs)</button>
    </div>
  </header>

  <main id="app-viewport">
    <!-- View content rendered dynamically -->
  </main>

  <script>
    // --- 1. DATA REPOSITORIES ---
    const LAB_EXPERIMENTS = [
      {
        id: 'exp-1',
        title: 'Experiment 1: First Fit Search Efficiency & Block Scanning',
        objective: 'Investigate how First Fit selects the first available memory block from address 0 KB and measure search cost.',
        scheme: 'dynamic',
        algorithm: 'first',
        actions: [
          { type: 'allocate', id: 'P1', size: 150 },
          { type: 'allocate', id: 'P2', size: 200 },
          { type: 'allocate', id: 'P3', size: 100 },
          { type: 'deallocate', id: 'P1' },
          { type: 'allocate', id: 'P4', size: 120 }
        ],
        expectedConcept: 'First Fit always scans from the beginning of memory and allocates into the first hole large enough, ignoring larger holes downstream.',
        observation: "Process P4 (120 KB) was placed into P1's freed hole (150 KB) because it was the first suitable block encountered.",
        conclusion: 'First Fit minimizes search time for early allocations but tends to clutter low memory addresses with small residual fragments.'
      },
      {
        id: 'exp-2',
        title: 'Experiment 2: Best Fit Minimization of Residual Waste',
        objective: 'Demonstrate how Best Fit scans all free holes to find the smallest hole that fits the request.',
        scheme: 'dynamic',
        algorithm: 'best',
        actions: [
          { type: 'allocate', id: 'P1', size: 100 },
          { type: 'allocate', id: 'P2', size: 300 },
          { type: 'allocate', id: 'P3', size: 100 },
          { type: 'allocate', id: 'P4', size: 200 },
          { type: 'deallocate', id: 'P2' },
          { type: 'allocate', id: 'P5', size: 150 }
        ],
        expectedConcept: 'Best Fit evaluates all candidate holes and chooses the one that leaves the smallest residual leftover space.',
        observation: 'Best Fit scanned both the 300 KB hole and high memory space, selecting the 300 KB hole to leave a 150 KB residual fragment.',
        conclusion: 'Best Fit achieves tight memory packing but can create tiny unusable residual fragments over time.'
      },
      {
        id: 'exp-3',
        title: 'Experiment 3: Worst Fit Preservation of Large Reusable Holes',
        objective: 'Observe how Worst Fit selects the largest available hole to keep the remaining fragment large enough for future processes.',
        scheme: 'dynamic',
        algorithm: 'worst',
        actions: [
          { type: 'allocate', id: 'P1', size: 100 },
          { type: 'allocate', id: 'P2', size: 200 },
          { type: 'allocate', id: 'P3', size: 100 },
          { type: 'allocate', id: 'P4', size: 400 },
          { type: 'deallocate', id: 'P2' },
          { type: 'allocate', id: 'P5', size: 150 }
        ],
        expectedConcept: 'Worst Fit chooses the largest available hole, producing a large leftover fragment that remains usable.',
        observation: 'Worst Fit placed P5 (150 KB) into the 400 KB hole instead of the 200 KB hole, leaving a large 250 KB usable fragment.',
        conclusion: 'Worst Fit prevents the creation of tiny unusable fragments but rapidly consumes large contiguous holes.'
      },
      {
        id: 'exp-4',
        title: 'Experiment 4: Next Fit Rotational Pointer Search',
        objective: 'Analyze Next Fit behavior by tracking search cursor position after consecutive allocations and deallocations.',
        scheme: 'dynamic',
        algorithm: 'next',
        actions: [
          { type: 'allocate', id: 'P1', size: 150 },
          { type: 'allocate', id: 'P2', size: 150 },
          { type: 'allocate', id: 'P3', size: 150 },
          { type: 'deallocate', id: 'P1' },
          { type: 'allocate', id: 'P4', size: 100 }
        ],
        expectedConcept: 'Next Fit continues searching from the last allocation address cursor rather than resetting to 0 KB.',
        observation: "Even though P1 freed 150 KB at low memory, Next Fit allocated P4 at high memory past P3 because its cursor was at P3's end address.",
        conclusion: 'Next Fit spreads allocations evenly across memory and reduces re-scanning low addresses.'
      },
      {
        id: 'exp-5',
        title: 'Experiment 5: External Fragmentation & Allocation Failure',
        objective: 'Demonstrate the exact condition where Total Free Memory >= Process Size but no single contiguous block is large enough.',
        scheme: 'dynamic',
        algorithm: 'first',
        actions: [
          { type: 'allocate', id: 'P1', size: 180 },
          { type: 'allocate', id: 'P2', size: 250 },
          { type: 'allocate', id: 'P3', size: 180 },
          { type: 'allocate', id: 'P4', size: 240 },
          { type: 'deallocate', id: 'P2' },
          { type: 'allocate', id: 'P5', size: 300 }
        ],
        expectedConcept: 'External fragmentation occurs when memory is fragmented into non-contiguous holes.',
        observation: 'Total Free Memory was 450 KB (250 KB + 200 KB), but P5 (300 KB) failed because the largest hole was 250 KB.',
        conclusion: 'A process cannot be allocated unless a single contiguous hole is at least as large as the request.'
      },
      {
        id: 'exp-6',
        title: 'Experiment 6: Memory Compaction & Defragmentation',
        objective: 'Show how memory compaction slides active processes together to coalesce scattered free space into a single contiguous block.',
        scheme: 'dynamic',
        algorithm: 'first',
        actions: [
          { type: 'allocate', id: 'P1', size: 180 },
          { type: 'allocate', id: 'P2', size: 250 },
          { type: 'allocate', id: 'P3', size: 180 },
          { type: 'deallocate', id: 'P2' },
          { type: 'allocate', id: 'P4', size: 300 },
          { type: 'compact', id: 'COMPACT' },
          { type: 'allocate', id: 'P4', size: 300 }
        ],
        expectedConcept: 'Compaction relocates active processes toward low memory, merging all free fragments into one large block at high memory.',
        observation: 'Before compaction P4 failed. After compaction, free space was consolidated into a 450 KB contiguous block, allowing P4 to allocate successfully.',
        conclusion: 'Compaction resolves external fragmentation but requires CPU overhead and process relocation.'
      },
      {
        id: 'exp-7',
        title: 'Experiment 7: Comprehensive 4-Algorithm Benchmark',
        objective: 'Compare First Fit, Best Fit, Worst Fit, and Next Fit on an identical process workload to evaluate memory utilization and search cost.',
        scheme: 'dynamic',
        algorithm: 'first',
        actions: [
          { type: 'allocate', id: 'P1', size: 200 },
          { type: 'allocate', id: 'P2', size: 150 },
          { type: 'allocate', id: 'P3', size: 250 },
          { type: 'allocate', id: 'P4', size: 100 },
          { type: 'deallocate', id: 'P2' },
          { type: 'allocate', id: 'P5', size: 180 }
        ],
        expectedConcept: 'Different fit algorithms exhibit trade-offs between execution speed (search steps) and fragmentation.',
        observation: 'Compare the memory map, external fragmentation, and search steps across all 4 algorithms in the Benchmark tab.',
        conclusion: 'No single algorithm is optimal for all workloads; choice depends on process size distribution and lifetime.'
      }
    ];

    // --- 2. GLOBAL SIMULATION STATE ---
    const state = {
      activeTab: 'simulator',
      totalMemory: 1024,
      osSize: 128,
      scheme: 'dynamic', // 'dynamic', 'fixed-equal'
      algorithm: 'first', // 'first', 'best', 'worst', 'next'
      nextFitPointer: 128,
      blocks: [],
      processes: [],
      logs: ['[OS BOOT] MEMORYMAP PRO Engine initialized. 1024 KB RAM active.'],
      lastAllocationFailedExtFrag: false,
      lastFailedDetails: null,
      searchStepsCount: 0,
      totalRequested: 0,
      succeeded: 0,
      failed: 0,

      // Benchmark specific state
      benchmarkScenario: 'fragmented', // 'fragmented', 'basic', 'current-workload', 'random'
      benchmarkStale: false,
      benchmarkResults: null,
      benchmarkActiveTraceAlgo: 'first',
      benchmarkRunCount: 0,
      lastBenchmarkRunTime: null,
      benchmarkJustRan: false,

      // Experiments state
      selectedExpIndex: 0
    };

    // --- 3. CORE MEMORY ENGINE ---
    function initMemory() {
      state.blocks = [];
      state.processes = [];
      state.nextFitPointer = state.osSize;
      state.searchStepsCount = 0;
      state.totalRequested = 0;
      state.succeeded = 0;
      state.failed = 0;
      state.lastAllocationFailedExtFrag = false;
      state.lastFailedDetails = null;
      state.benchmarkStale = true;

      // OS Reserved Block
      state.blocks.push({
        id: 'block-os',
        startAddr: 0,
        endAddr: state.osSize,
        size: state.osSize,
        status: 'os',
        processId: 'OS Kernel',
        processName: 'OS Kernel',
        reqSize: state.osSize,
        internalFrag: 0
      });

      const userSpace = state.totalMemory - state.osSize;
      if (state.scheme === 'dynamic') {
        state.blocks.push({
          id: 'block-free-0',
          startAddr: state.osSize,
          endAddr: state.totalMemory,
          size: userSpace,
          status: 'free',
          internalFrag: 0
        });
      } else {
        // Fixed Equal Partitions: 128 KB each
        let addr = state.osSize;
        let idx = 1;
        while (addr + 128 <= state.totalMemory) {
          state.blocks.push({
            id: `part-${idx}`,
            startAddr: addr,
            endAddr: addr + 128,
            size: 128,
            status: 'free',
            internalFrag: 0,
            partitionId: `Partition ${idx} (128 KB)`
          });
          addr += 128;
          idx++;
        }
      }
    }

    function getMetrics() {
      let usedRam = 0;
      let freeRam = 0;
      let internalFrag = 0;
      const freeHoles = [];

      state.blocks.forEach(b => {
        if (b.status === 'allocated') {
          usedRam += (b.reqSize || b.size);
          internalFrag += b.internalFrag;
        } else if (b.status === 'free') {
          freeRam += b.size;
          freeHoles.push(b.size);
        }
      });

      const availableRam = state.totalMemory - state.osSize;
      const utilizationPct = availableRam > 0 ? Math.round((usedRam / availableRam) * 100) : 0;
      const largestFreeBlock = freeHoles.length > 0 ? Math.max(...freeHoles) : 0;
      const freeHolesCount = freeHoles.length;
      const externalFrag = freeHolesCount > 1 ? freeRam : (state.scheme !== 'dynamic' ? freeRam : 0);
      
      const avgSearchSteps = state.totalRequested > 0 ? parseFloat((state.searchStepsCount / state.totalRequested).toFixed(1)) : 1.0;

      return {
        totalMemory: state.totalMemory,
        osSize: state.osSize,
        availableRam,
        usedRam,
        freeRam,
        utilizationPct,
        internalFrag,
        externalFrag,
        largestFreeBlock,
        freeHolesCount,
        succeeded: state.succeeded,
        failed: state.failed,
        totalRequested: state.totalRequested,
        avgSearchSteps,
        fragInducedFailure: state.lastAllocationFailedExtFrag
      };
    }

    function allocateProcess(processId, reqSize, processName) {
      state.totalRequested++;
      state.benchmarkStale = true;
      const name = processName || processId;

      if (reqSize <= 0 || reqSize > (state.totalMemory - state.osSize)) {
        state.failed++;
        state.searchStepsCount += 1;
        state.logs.push(`[SEARCH] ${processId} (${reqSize} KB) → Exceeds available RAM capacity.`);
        state.logs.push(`[FAILED] Allocation rejected.`);
        renderApp();
        return false;
      }

      const freeHoles = [];
      state.blocks.forEach((b, idx) => { if (b.status === 'free') freeHoles.push({ block: b, index: idx }); });

      if (freeHoles.length === 0) {
        state.failed++;
        state.searchStepsCount += 1;
        state.logs.push(`[SEARCH] ${processId} (${reqSize} KB) → Examined 0 free holes (RAM completely full).`);
        state.logs.push(`[FAILED] Allocation rejected.`);
        renderApp();
        return false;
      }

      let blocksExamined = 0;
      let chosenHole = null;

      if (state.algorithm === 'first') {
        state.logs.push(`[SEARCH] ${processId} (${reqSize} KB) → First Fit scanning holes from address ${state.osSize} KB...`);
        for (let i = 0; i < freeHoles.length; i++) {
          blocksExamined++;
          const h = freeHoles[i];
          if (h.block.size >= reqSize) {
            chosenHole = h;
            state.logs.push(`  └─ [CHECK] Hole #${i+1} at ${h.block.startAddr} KB (${h.block.size} KB): FIT FOUND!`);
            break;
          } else {
            state.logs.push(`  └─ [CHECK] Hole #${i+1} at ${h.block.startAddr} KB (${h.block.size} KB): Too small.`);
          }
        }
      } else if (state.algorithm === 'best') {
        state.logs.push(`[SEARCH] ${processId} (${reqSize} KB) → Best Fit evaluating all ${freeHoles.length} holes for minimal waste...`);
        const candidateHoles = [];
        freeHoles.forEach((h, idx) => {
          blocksExamined++;
          if (h.block.size >= reqSize) {
            candidateHoles.push(h);
            state.logs.push(`  └─ [CHECK] Hole #${idx+1} at ${h.block.startAddr} KB (${h.block.size} KB): Candidate (Residual: ${h.block.size - reqSize} KB)`);
          } else {
            state.logs.push(`  └─ [CHECK] Hole #${idx+1} at ${h.block.startAddr} KB (${h.block.size} KB): Too small.`);
          }
        });
        if (candidateHoles.length > 0) {
          candidateHoles.sort((a, b) => a.block.size - b.block.size);
          chosenHole = candidateHoles[0];
          state.logs.push(`[SELECT] Best Fit selected hole at ${chosenHole.block.startAddr} KB (${chosenHole.block.size} KB, Residual waste: ${chosenHole.block.size - reqSize} KB).`);
        }
      } else if (state.algorithm === 'worst') {
        state.logs.push(`[SEARCH] ${processId} (${reqSize} KB) → Worst Fit evaluating all ${freeHoles.length} holes for maximum remaining space...`);
        const candidateHoles = [];
        freeHoles.forEach((h, idx) => {
          blocksExamined++;
          if (h.block.size >= reqSize) {
            candidateHoles.push(h);
            state.logs.push(`  └─ [CHECK] Hole #${idx+1} at ${h.block.startAddr} KB (${h.block.size} KB): Candidate (Remaining: ${h.block.size - reqSize} KB)`);
          } else {
            state.logs.push(`  └─ [CHECK] Hole #${idx+1} at ${h.block.startAddr} KB (${h.block.size} KB): Too small.`);
          }
        });
        if (candidateHoles.length > 0) {
          candidateHoles.sort((a, b) => b.block.size - a.block.size);
          chosenHole = candidateHoles[0];
          state.logs.push(`[SELECT] Worst Fit selected hole at ${chosenHole.block.startAddr} KB (${chosenHole.block.size} KB, Remaining waste: ${chosenHole.block.size - reqSize} KB).`);
        }
      } else if (state.algorithm === 'next') {
        state.logs.push(`[SEARCH] ${processId} (${reqSize} KB) → Next Fit scanning starting from cursor ${state.nextFitPointer} KB...`);
        for (let i = 0; i < freeHoles.length; i++) {
          const h = freeHoles[i];
          if (h.block.startAddr >= state.nextFitPointer) {
            blocksExamined++;
            if (h.block.size >= reqSize) {
              chosenHole = h;
              state.logs.push(`  └─ [CHECK] Hole at ${h.block.startAddr} KB (${h.block.size} KB) past cursor: FIT FOUND!`);
              break;
            } else {
              state.logs.push(`  └─ [CHECK] Hole at ${h.block.startAddr} KB (${h.block.size} KB) past cursor: Too small.`);
            }
          }
        }
        if (!chosenHole) {
          state.logs.push(`  └─ [WRAP] Reached memory end. Wrapping search around to address ${state.osSize} KB...`);
          for (let i = 0; i < freeHoles.length; i++) {
            const h = freeHoles[i];
            if (h.block.startAddr < state.nextFitPointer) {
              blocksExamined++;
              if (h.block.size >= reqSize) {
                chosenHole = h;
                state.logs.push(`  └─ [CHECK] Wrapped hole at ${h.block.startAddr} KB (${h.block.size} KB): FIT FOUND!`);
                break;
              } else {
                state.logs.push(`  └─ [CHECK] Wrapped hole at ${h.block.startAddr} KB (${h.block.size} KB): Too small.`);
              }
            }
          }
        }
      }

      state.searchStepsCount += blocksExamined;
      state.logs.push(`[SEARCH STATS] Holes examined: ${blocksExamined}`);

      if (!chosenHole) {
        const metrics = getMetrics();
        state.failed++;
        
        const isExtFragFailure = (metrics.freeRam >= reqSize) && (metrics.largestFreeBlock < reqSize);
        state.lastAllocationFailedExtFrag = isExtFragFailure;
        state.lastFailedDetails = {
          reqSize,
          freeRam: metrics.freeRam,
          largestFreeBlock: metrics.largestFreeBlock,
          freeHolesCount: metrics.freeHolesCount,
          isExtFrag: isExtFragFailure
        };

        if (isExtFragFailure) {
          state.logs.push(`🚨 [EXTERNAL FRAGMENTATION FAILURE] Process ${processId} (${reqSize} KB) failed.`);
          state.logs.push(`  Required: ${reqSize} KB | Total Free RAM: ${metrics.freeRam} KB | Largest Contiguous Hole: ${metrics.largestFreeBlock} KB`);
          state.logs.push(`  Reason: Enough total free memory exists, but no single contiguous hole is large enough.`);
        } else {
          state.logs.push(`🚨 [INSUFFICIENT RAM] Total Free RAM (${metrics.freeRam} KB) is strictly less than required size (${reqSize} KB).`);
        }
        renderApp();
        return false;
      }

      const targetBlock = chosenHole.block;
      const targetIndex = state.blocks.indexOf(targetBlock);
      const internalFrag = state.scheme !== 'dynamic' ? (targetBlock.size - reqSize) : 0;

      const allocatedBlock = {
        id: `block-proc-${processId}-${Date.now()}`,
        startAddr: targetBlock.startAddr,
        endAddr: state.scheme === 'dynamic' ? (targetBlock.startAddr + reqSize) : targetBlock.endAddr,
        size: state.scheme === 'dynamic' ? reqSize : targetBlock.size,
        status: 'allocated',
        processId,
        processName: name,
        reqSize,
        internalFrag
      };

      const remainingSize = targetBlock.size - reqSize;
      if (remainingSize > 0 && state.scheme === 'dynamic') {
        const splitFreeBlock = {
          id: `block-free-${Date.now()}`,
          startAddr: targetBlock.startAddr + reqSize,
          endAddr: targetBlock.endAddr,
          size: remainingSize,
          status: 'free',
          internalFrag: 0
        };
        state.blocks.splice(targetIndex, 1, allocatedBlock, splitFreeBlock);
      } else {
        state.blocks.splice(targetIndex, 1, allocatedBlock);
      }

      state.nextFitPointer = (allocatedBlock.endAddr) % state.totalMemory;
      if (state.nextFitPointer < state.osSize) state.nextFitPointer = state.osSize;

      state.succeeded++;
      state.processes.push({ id: processId, name, reqSize, status: 'allocated', internalFrag });
      state.logs.push(`[SUCCESS] Allocated ${processId} (${reqSize} KB) at physical address range ${allocatedBlock.startAddr} KB — ${allocatedBlock.endAddr} KB.`);
      state.lastAllocationFailedExtFrag = false;
      state.lastFailedDetails = null;

      renderApp();
      return true;
    }

    function deallocateProcess(processId) {
      state.benchmarkStale = true;
      let found = false;
      state.blocks.forEach(b => {
        if (b.status === 'allocated' && b.processId === processId) {
          b.status = 'free';
          b.processId = undefined;
          b.processName = undefined;
          b.reqSize = 0;
          b.internalFrag = 0;
          found = true;
          state.logs.push(`[FREE] Deallocated process ${processId} at range ${b.startAddr} — ${b.endAddr} KB.`);
        }
      });

      if (found) {
        mergeAdjacentFreeBlocks();
        state.processes = state.processes.filter(p => p.id !== processId);
      }
      renderApp();
    }

    function mergeAdjacentFreeBlocks() {
      if (state.scheme !== 'dynamic') return;
      let i = 0;
      let merged = 0;
      while (i < state.blocks.length - 1) {
        const curr = state.blocks[i];
        const next = state.blocks[i + 1];
        if (curr.status === 'free' && next.status === 'free') {
          curr.size += next.size;
          curr.endAddr = next.endAddr;
          state.blocks.splice(i + 1, 1);
          merged++;
        } else {
          i++;
        }
      }
      if (merged > 0) {
        state.logs.push(`[COALESCING] Automatically merged ${merged + 1} adjacent free blocks into a single contiguous hole.`);
      }
    }

    function compactMemory() {
      if (state.scheme !== 'dynamic') return;
      state.benchmarkStale = true;
      const osBlock = state.blocks[0];
      const allocatedBlocks = state.blocks.filter(b => b.status === 'allocated');
      let currentAddr = state.osSize;
      const newBlocks = [osBlock];

      allocatedBlocks.forEach(b => {
        b.startAddr = currentAddr;
        b.endAddr = currentAddr + b.size;
        currentAddr += b.size;
        newBlocks.push(b);
      });

      const totalFreeSize = state.totalMemory - currentAddr;
      if (totalFreeSize > 0) {
        newBlocks.push({
          id: `block-free-compact-${Date.now()}`,
          startAddr: currentAddr,
          endAddr: state.totalMemory,
          size: totalFreeSize,
          status: 'free',
          internalFrag: 0
        });
      }

      state.blocks = newBlocks;
      state.nextFitPointer = currentAddr % state.totalMemory;
      if (state.nextFitPointer < state.osSize) state.nextFitPointer = state.osSize;
      state.lastAllocationFailedExtFrag = false;
      state.lastFailedDetails = null;
      state.logs.push(`[COMPACTION] Relocated ${allocatedBlocks.length} processes down to low memory. Consolidated ${totalFreeSize} KB free space into a single contiguous hole at high memory.`);
      renderApp();
    }

    function resetState() {
      initMemory();
      state.logs = ['[RESET] Simulator reset to clean default state.'];
      renderApp();
    }

    function triggerRandomScenario() {
      resetState();
      [180, 250, 180, 240].forEach((sz, i) => allocateProcess(`P${i+1}`, sz));
    }

    function toggleDemoMode() {
      triggerRandomScenario();
      switchTab('simulator');
    }

    function switchTab(tabName) {
      state.activeTab = tabName;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`tab-btn-${tabName}`);
      if (activeBtn) activeBtn.classList.add('active');
      if (tabName === 'benchmark' && (!state.benchmarkResults || state.benchmarkStale)) {
        runBenchmark();
        return;
      }
      renderApp();
    }

    // --- 4. BENCHMARK ENGINE CORE ---
    function getBenchmarkScenarioDefinition(scenarioKey) {
      if (scenarioKey === 'fragmented') {
        const initialBlocks = [
          { id: 'b-os', startAddr: 0, endAddr: 128, size: 128, status: 'os', processId: 'OS Kernel', reqSize: 128, internalFrag: 0 },

        const workload = [

    function runSingleAlgorithmBenchmark(algoId, scenarioDef) {
      const blocks = JSON.parse(JSON.stringify(scenarioDef.initialBlocks));
      const workload = scenarioDef.workload;
      let nextFitPointer = scenarioDef.initialPointer;
      
      let totalSearchSteps = 0;
      let totalRequests = workload.length;
      let successfulAllocations = 0;
      let failedAllocations = 0;
      let fragFailures = 0;
      const traceLogs = [];

      traceLogs.push(`=== ${algoId.toUpperCase()} FIT INDEPENDENT BENCHMARK RUN ===`);
      traceLogs.push(`[INIT] Cloned initial memory with ${blocks.length} blocks. Workload: ${workload.length} processes.`);

      workload.forEach((proc, pIdx) => {
        traceLogs.push(`\n[SEARCH] Process ${proc.id} requires ${proc.size} KB`);
        
        const freeHoles = [];
        blocks.forEach((b, idx) => {
          if (b.status === 'free') freeHoles.push({ block: b, index: idx });
        });

        if (freeHoles.length === 0) {
          failedAllocations++;
          totalSearchSteps += 1;
          traceLogs.push(`[CHECK] 0 free holes available (Memory completely full).`);
          traceLogs.push(`[FAILED] Process ${proc.id} allocation rejected.`);
          return;
        }

        let stepsForProc = 0;
        let chosenHole = null;

        if (algoId === 'first') {
          for (let i = 0; i < freeHoles.length; i++) {
            stepsForProc++;
            const h = freeHoles[i];
            if (h.block.size >= proc.size) {
              chosenHole = h;
              traceLogs.push(`[CHECK] Hole #${i+1} at ${h.block.startAddr} KB (${h.block.size} KB) → FIT FOUND (First match)!`);
              break;
            } else {
              traceLogs.push(`[CHECK] Hole #${i+1} at ${h.block.startAddr} KB (${h.block.size} KB) → TOO SMALL`);
            }
          }
        } else if (algoId === 'best') {
          const candidates = [];
          freeHoles.forEach((h, i) => {
            stepsForProc++;
            if (h.block.size >= proc.size) {
              candidates.push(h);
              traceLogs.push(`[CHECK] Hole #${i+1} at ${h.block.startAddr} KB (${h.block.size} KB) → CANDIDATE (Residual: ${h.block.size - proc.size} KB)`);
            } else {
              traceLogs.push(`[CHECK] Hole #${i+1} at ${h.block.startAddr} KB (${h.block.size} KB) → TOO SMALL`);
            }
          });

          if (candidates.length > 0) {
            candidates.sort((a, b) => a.block.size - b.block.size);
            chosenHole = candidates[0];
            traceLogs.push(`[SELECT] Best Fit selected hole at ${chosenHole.block.startAddr} KB (${chosenHole.block.size} KB, Residual waste: ${chosenHole.block.size - proc.size} KB)`);
          }
        } else if (algoId === 'worst') {
          const candidates = [];
          freeHoles.forEach((h, i) => {
            stepsForProc++;
            if (h.block.size >= proc.size) {
              candidates.push(h);
              traceLogs.push(`[CHECK] Hole #${i+1} at ${h.block.startAddr} KB (${h.block.size} KB) → CANDIDATE (Remaining: ${h.block.size - proc.size} KB)`);
            } else {
              traceLogs.push(`[CHECK] Hole #${i+1} at ${h.block.startAddr} KB (${h.block.size} KB) → TOO SMALL`);
            }
          });

          if (candidates.length > 0) {
            candidates.sort((a, b) => b.block.size - a.block.size);
            chosenHole = candidates[0];
            traceLogs.push(`[SELECT] Worst Fit selected hole at ${chosenHole.block.startAddr} KB (${chosenHole.block.size} KB, Remaining waste: ${chosenHole.block.size - proc.size} KB)`);
          }
        } else if (algoId === 'next') {
          traceLogs.push(`[CURSOR] Starting scan from Next-Fit pointer: ${nextFitPointer} KB`);
          for (let i = 0; i < freeHoles.length; i++) {
            const h = freeHoles[i];
            if (h.block.startAddr >= nextFitPointer) {
              stepsForProc++;
              if (h.block.size >= proc.size) {
                chosenHole = h;
                traceLogs.push(`[CHECK] Hole at ${h.block.startAddr} KB (${h.block.size} KB) past cursor → FIT FOUND!`);
                break;
              } else {
                traceLogs.push(`[CHECK] Hole at ${h.block.startAddr} KB (${h.block.size} KB) past cursor → TOO SMALL`);
              }
            }
          }

          if (!chosenHole) {
            traceLogs.push(`[WRAP] Search wrapped around to memory start...`);
            for (let i = 0; i < freeHoles.length; i++) {
              const h = freeHoles[i];
              if (h.block.startAddr < nextFitPointer) {
                stepsForProc++;
                if (h.block.size >= proc.size) {
                  chosenHole = h;
                  traceLogs.push(`[CHECK] Wrapped hole at ${h.block.startAddr} KB (${h.block.size} KB) → FIT FOUND!`);
                  break;
                } else {
                  traceLogs.push(`[CHECK] Wrapped hole at ${h.block.startAddr} KB (${h.block.size} KB) → TOO SMALL`);
                }
              }
            }
          }
        }

        totalSearchSteps += stepsForProc;
        traceLogs.push(`[SEARCH STATS] Holes examined: ${stepsForProc}`);

        if (chosenHole) {
          const targetBlock = chosenHole.block;
          const targetIndex = blocks.indexOf(targetBlock);

          const allocatedBlock = {
            id: `b-${algoId}-${proc.id}`,
            startAddr: targetBlock.startAddr,
            endAddr: targetBlock.startAddr + proc.size,
            size: proc.size,
            status: 'allocated',
            processId: proc.id,
            processName: proc.name,
            reqSize: proc.size,
            internalFrag: 0
          };

          const remainingSize = targetBlock.size - proc.size;
          if (remainingSize > 0) {
            const splitFreeBlock = {
              id: `b-free-${algoId}-${Date.now()}-${pIdx}`,
              startAddr: targetBlock.startAddr + proc.size,
              endAddr: targetBlock.endAddr,
              size: remainingSize,
              status: 'free',
              internalFrag: 0
            };
            blocks.splice(targetIndex, 1, allocatedBlock, splitFreeBlock);
          } else {
            blocks.splice(targetIndex, 1, allocatedBlock);
          }

          nextFitPointer = (allocatedBlock.endAddr) % state.totalMemory;
          if (nextFitPointer < state.osSize) nextFitPointer = state.osSize;

          successfulAllocations++;
          traceLogs.push(`[SUCCESS] ${proc.id} allocated at physical range ${allocatedBlock.startAddr} — ${allocatedBlock.endAddr} KB.`);
        } else {
          failedAllocations++;
          traceLogs.push(`[FAILED] No suitable hole large enough for ${proc.id} (${proc.size} KB).`);

          let currentFreeSum = 0;
          let currentLargest = 0;
          blocks.forEach(b => {
            if (b.status === 'free') {
              currentFreeSum += b.size;
              if (b.size > currentLargest) currentLargest = b.size;
            }
          });

          if (currentFreeSum >= proc.size && currentLargest < proc.size) {
            fragFailures++;
            traceLogs.push(`⚠ [EXTERNAL FRAGMENTATION ALLOCATION FAILURE]`);
            traceLogs.push(`  Required: ${proc.size} KB | Total Free RAM: ${currentFreeSum} KB | Largest Contiguous Hole: ${currentLargest} KB`);
            traceLogs.push(`  Reason: Enough total memory exists, but no single contiguous hole is large enough.`);
          }
        }
      });

      let usedRam = 0;
      let totalFree = 0;
      let internalFrag = 0;
      const freeHoles = [];

      blocks.forEach(b => {
        if (b.status === 'allocated') {
          usedRam += (b.reqSize || b.size);
          internalFrag += b.internalFrag;
        } else if (b.status === 'free') {
          totalFree += b.size;
          freeHoles.push(b.size);
        }
      });

      const availableRam = state.totalMemory - state.osSize;
      const utilizationPct = availableRam > 0 ? Math.round((usedRam / availableRam) * 100) : 0;
      const largestFreeHole = freeHoles.length > 0 ? Math.max(...freeHoles) : 0;
      const freeHoleCount = freeHoles.length;
      const externalFrag = freeHoleCount > 1 ? totalFree : 0;
      const avgSearchSteps = totalRequests > 0 ? parseFloat((totalSearchSteps / totalRequests).toFixed(2)) : 0;
      const compactionRequired = fragFailures > 0 || failedAllocations > 0;

      return {
        algoId,
        successfulAllocations,
        failedAllocations,
        utilizationPct,
        totalFree,
        largestFreeHole,
        freeHoleCount,
        internalFrag,
        externalFrag,
        totalSearchSteps,
        avgSearchSteps,
        fragFailures,
        compactionRequired,
        finalBlocks: blocks,
        traceLogs
      };
    }

    function executeBenchmark() {
      const scenarioDef = getBenchmarkScenarioDefinition(state.benchmarkScenario);
      
      const firstFitRes = runSingleAlgorithmBenchmark('first', scenarioDef);
      const bestFitRes = runSingleAlgorithmBenchmark('best', scenarioDef);
      const worstFitRes = runSingleAlgorithmBenchmark('worst', scenarioDef);
      const nextFitRes = runSingleAlgorithmBenchmark('next', scenarioDef);

      const list = [firstFitRes, bestFitRes, worstFitRes, nextFitRes];
      let bestAlgo = list[0];

      list.forEach(item => {
        if (item.successfulAllocations > bestAlgo.successfulAllocations) {
          bestAlgo = item;
        } else if (item.successfulAllocations === bestAlgo.successfulAllocations) {
          if (item.utilizationPct > bestAlgo.utilizationPct) {
            bestAlgo = item;
          } else if (item.utilizationPct === bestAlgo.utilizationPct && item.avgSearchSteps < bestAlgo.avgSearchSteps) {
            bestAlgo = item;
          }
        }
      });

      const tiedAlgos = list.filter(item => 
        item.successfulAllocations === bestAlgo.successfulAllocations && 
        item.utilizationPct === bestAlgo.utilizationPct &&
        Math.abs(item.avgSearchSteps - bestAlgo.avgSearchSteps) < 0.05
      );

      const nameMap = { first: 'First Fit', best: 'Best Fit', worst: 'Worst Fit', next: 'Next Fit' };
      const reasons = [];

      let winnerTitle = nameMap[bestAlgo.algoId];
      if (tiedAlgos.length > 1) {
        winnerTitle = tiedAlgos.map(a => nameMap[a.algoId]).join(' & ') + ' (Tie)';
      }

      reasons.push(`Allocated ${bestAlgo.successfulAllocations}/${scenarioDef.workload.length} processes (${bestAlgo.utilizationPct}% memory utilization)`);
      
      if (bestAlgo.fragFailures === 0) {
        reasons.push('Suffered zero fragmentation-induced allocation failures');
      } else {
        reasons.push(`Experienced ${bestAlgo.fragFailures} fragmentation-induced failure(s)`);
      }
      
      reasons.push(`Average search cost: ${bestAlgo.avgSearchSteps} steps per allocation`);

      if (bestAlgo.failedAllocations === 0) {
        reasons.push('All processes were successfully allocated without compaction');
      } else {
        reasons.push(`${bestAlgo.failedAllocations} process(es) failed allocation due to contiguous hole constraints`);
        reasons.push('No compaction was performed during this benchmark run');
      }

      state.benchmarkStale = false;
      state.benchmarkResults = {
        scenario: scenarioDef,
        first: firstFitRes,
        best: bestFitRes,
        worst: worstFitRes,
        next: nextFitRes,
        recommendation: {
          algo: winnerTitle,
          algoId: bestAlgo.algoId,
          reasons
        }
      };
    }

              <span style="font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">Benchmark Workload Scenario:</span>
              <select onchange="runBenchmark(this.value);" style="max-width: 540px;">
                <option value="fragmented" ${state.benchmarkScenario === 'fragmented' ? 'selected' : ''}>Fragmentation Benchmark Scenario (Multiple Diverse Holes: 120K, 250K, 176K)</option>
                <option value="basic" ${state.benchmarkScenario === 'basic' ? 'selected' : ''}>Basic Sequential Scenario (Single 896 KB Hole)</option>
                <option value="current-workload" ${state.benchmarkScenario === 'current-workload' ? 'selected' : ''}>Live Simulator Workload (Compares placement of current active processes)</option>
                <option value="random" ${state.benchmarkScenario === 'random' ? 'selected' : ''}>Random Multi-Hole Workload Scenario</option>
              </select>
            </div>
            <p style="font-size: 11px; color: var(--text-muted); line-height: 1.4;">${s.description}</p>
          </div>

          <!-- Dynamic Recommendation Banner Card -->
          <div class="card" style="background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 27, 75, 0.7)); border-color: rgba(99, 102, 241, 0.5);">
            <div style="display: flex; align-items: flex-start; gap: 14px;">
              <div style="font-size: 32px; line-height: 1;">🏆</div>
              <div style="display: flex; flex-direction: column; gap: 6px;">
                <div style="font-size: 15px; font-weight: 800; color: white;">
                  RECOMMENDED ALGORITHM FOR THIS WORKLOAD: <span style="color: var(--primary-cyan); text-transform: uppercase;">${bData.recommendation.algo}</span>
                </div>
                <div style="font-size: 12px; color: #cbd5e1;">
                  Measured justification derived from independent simulation metrics:
                </div>
                <ul style="font-size: 11px; color: #94a3b8; margin-left: 18px; display: flex; flex-direction: column; gap: 2px;">
                  ${bData.recommendation.reasons.map(r => `<li><strong style="color: white;">${r}</strong></li>`).join('')}
                </ul>
              </div>
            </div>
          </div>

          <!-- 4-Way Side-by-Side Visual Memory Tracks -->
          <div class="benchmark-grid">
            ${[
              { name: 'First Fit', res: f, id: 'first' },
              { name: 'Best Fit', res: b, id: 'best' },
              { name: 'Worst Fit', res: w, id: 'worst' },
              { name: 'Next Fit', res: n, id: 'next' }
            ].map(algo => `
              <div class="benchmark-card">
                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 6px;">
                  <strong style="font-size: 13px; color: var(--primary-cyan);">${algo.name}</strong>
                  <span style="font-size: 11px; font-family: 'Fira Code', monospace; color: ${algo.res.successfulAllocations === s.workload.length ? 'var(--accent-emerald)' : 'var(--accent-rose)'}; font-weight: 700;">
                    ${algo.res.successfulAllocations}/${s.workload.length} Allocated (${algo.res.utilizationPct}%)
                  </span>
                </div>

                <div class="benchmark-track">
                  ${algo.res.finalBlocks.map(blk => {
                    const widthPct = (blk.size / state.totalMemory) * 100;
                    if (blk.status === 'os') {
                      return `<div style="width: ${widthPct}%; height: 100%; background: #1e293b; border-right: 1px solid #334155; font-size: 9px; font-family: 'Fira Code', monospace; display: flex; align-items: center; justify-content: center; color: var(--primary-cyan);" title="OS Kernel">SYS</div>`;
                    }
                    if (blk.status === 'allocated') {
                      return `<div style="width: ${widthPct}%; height: 100%; background: linear-gradient(135deg, #0e7490, #4338ca); border-right: 1px solid rgba(255,255,255,0.2); font-size: 9px; font-family: 'Fira Code', monospace; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; overflow: hidden;" title="${blk.processId}: ${blk.size} KB">${blk.processId}</div>`;
                    }
                    return `<div style="width: ${widthPct}%; height: 100%; background: #020617; border-right: 1px dashed #334155; font-size: 8px; font-family: 'Fira Code', monospace; display: flex; align-items: center; justify-content: center; color: #64748b;" title="Free: ${blk.size} KB">${blk.size}K</div>`;
                  }).join('')}
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px; font-size: 10px; font-family: 'Fira Code', monospace; color: var(--text-muted);">
                  <div>Search Steps: <strong style="color: var(--primary-indigo);">${algo.res.avgSearchSteps} / alloc</strong></div>
                  <div>Ext Frag: <strong style="color: var(--accent-amber);">${algo.res.externalFrag} KB</strong></div>
                  <div>Largest Hole: <strong style="color: var(--accent-emerald);">${algo.res.largestFreeHole} KB</strong></div>
                  <div>Failures: <strong style="color: ${algo.res.failedAllocations > 0 ? 'var(--accent-rose)' : 'white'};">${algo.res.failedAllocations}</strong></div>
                </div>
              </div>
            `).join('')}
          </div>

          <!-- Comprehensive Side-by-Side Comparison Metrics Table -->
          <div class="card">
            <div class="card-title">
              <span>Dynamic Performance Comparison Metrics Table</span>
              <span class="badge-tag">MEASURED SIMULATION DATA</span>
            </div>

            <div style="overflow-x: auto;">
              <table>
                <thead>
                  <tr>
                    <th>Simulation Metric</th>
                    <th style="text-align: right;">First Fit</th>
                    <th style="text-align: right;">Best Fit</th>
                    <th style="text-align: right;">Worst Fit</th>
                    <th style="text-align: right;">Next Fit</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td><strong>Successful Allocations</strong></td>
                    <td style="text-align: right; font-weight: 700;">${f.successfulAllocations} / ${s.workload.length} ${f.successfulAllocations === maxAlloc ? '<span class="badge-winner">BEST</span>' : ''}</td>
                    <td style="text-align: right; font-weight: 700;">${b.successfulAllocations} / ${s.workload.length} ${b.successfulAllocations === maxAlloc ? '<span class="badge-winner">BEST</span>' : ''}</td>
                    <td style="text-align: right; font-weight: 700;">${w.successfulAllocations} / ${s.workload.length} ${w.successfulAllocations === maxAlloc ? '<span class="badge-winner">BEST</span>' : ''}</td>
                    <td style="text-align: right; font-weight: 700;">${n.successfulAllocations} / ${s.workload.length} ${n.successfulAllocations === maxAlloc ? '<span class="badge-winner">BEST</span>' : ''}</td>
                  </tr>
                  <tr>
                    <td><strong>Failed Allocations</strong></td>
                    <td style="text-align: right; color: ${f.failedAllocations > 0 ? 'var(--accent-rose)' : 'var(--accent-emerald)'}; font-weight: 700;">${f.failedAllocations}</td>
                    <td style="text-align: right; color: ${b.failedAllocations > 0 ? 'var(--accent-rose)' : 'var(--accent-emerald)'}; font-weight: 700;">${b.failedAllocations}</td>
                    <td style="text-align: right; color: ${w.failedAllocations > 0 ? 'var(--accent-rose)' : 'var(--accent-emerald)'}; font-weight: 700;">${w.failedAllocations}</td>
                    <td style="text-align: right; color: ${n.failedAllocations > 0 ? 'var(--accent-rose)' : 'var(--accent-emerald)'}; font-weight: 700;">${n.failedAllocations}</td>
                  </tr>
                  <tr>
                    <td><strong>RAM Utilization %</strong></td>
                    <td style="text-align: right; font-weight: 700; color: var(--primary-cyan);">${f.utilizationPct}% ${f.utilizationPct === maxUtil ? '<span class="badge-winner">MAX</span>' : ''}</td>
                    <td style="text-align: right; font-weight: 700; color: var(--primary-cyan);">${b.utilizationPct}% ${b.utilizationPct === maxUtil ? '<span class="badge-winner">MAX</span>' : ''}</td>
                    <td style="text-align: right; font-weight: 700; color: var(--primary-cyan);">${w.utilizationPct}% ${w.utilizationPct === maxUtil ? '<span class="badge-winner">MAX</span>' : ''}</td>
                    <td style="text-align: right; font-weight: 700; color: var(--primary-cyan);">${n.utilizationPct}% ${n.utilizationPct === maxUtil ? '<span class="badge-winner">MAX</span>' : ''}</td>
                  </tr>
                  <tr>
                    <td><strong>Total Free Memory (KB)</strong></td>
                    <td style="text-align: right;">${f.totalFree} KB</td>
                    <td style="text-align: right;">${b.totalFree} KB</td>
                    <td style="text-align: right;">${w.totalFree} KB</td>
                    <td style="text-align: right;">${n.totalFree} KB</td>
                  </tr>
                  <tr>
                    <td><strong>Largest Free Hole (KB)</strong></td>
                    <td style="text-align: right; font-weight: 700;">${f.largestFreeHole} KB</td>
                    <td style="text-align: right; font-weight: 700;">${b.largestFreeHole} KB</td>
                    <td style="text-align: right; font-weight: 700;">${w.largestFreeHole} KB</td>
                    <td style="text-align: right; font-weight: 700;">${n.largestFreeHole} KB</td>
                  </tr>
                  <tr>
                    <td><strong>Free Hole Count</strong></td>
                    <td style="text-align: right;">${f.freeHoleCount}</td>
                    <td style="text-align: right;">${b.freeHoleCount}</td>
                    <td style="text-align: right;">${w.freeHoleCount}</td>
                    <td style="text-align: right;">${n.freeHoleCount}</td>
                  </tr>
                  <tr>
                    <td><strong>Internal Fragmentation (KB)</strong></td>
                    <td style="text-align: right; color: var(--text-muted);">${f.internalFrag} KB</td>
                    <td style="text-align: right; color: var(--text-muted);">${b.internalFrag} KB</td>
                    <td style="text-align: right; color: var(--text-muted);">${w.internalFrag} KB</td>
                    <td style="text-align: right; color: var(--text-muted);">${n.internalFrag} KB</td>
                  </tr>
                  <tr>
                    <td><strong>External Fragmentation (KB)</strong></td>
                    <td style="text-align: right; color: var(--accent-amber); font-weight: 700;">${f.externalFrag} KB ${f.externalFrag === minFrag ? '<span class="badge-winner">LOW</span>' : ''}</td>
                    <td style="text-align: right; color: var(--accent-amber); font-weight: 700;">${b.externalFrag} KB ${b.externalFrag === minFrag ? '<span class="badge-winner">LOW</span>' : ''}</td>
                    <td style="text-align: right; color: var(--accent-amber); font-weight: 700;">${w.externalFrag} KB ${w.externalFrag === minFrag ? '<span class="badge-winner">LOW</span>' : ''}</td>
                    <td style="text-align: right; color: var(--accent-amber); font-weight: 700;">${n.externalFrag} KB ${n.externalFrag === minFrag ? '<span class="badge-winner">LOW</span>' : ''}</td>
                  </tr>
                  <tr>
                    <td><strong>Total Search Steps</strong></td>
                    <td style="text-align: right;">${f.totalSearchSteps} steps</td>
                    <td style="text-align: right;">${b.totalSearchSteps} steps</td>
                    <td style="text-align: right;">${w.totalSearchSteps} steps</td>
                    <td style="text-align: right;">${n.totalSearchSteps} steps</td>
                  </tr>
                  <tr>
                    <td><strong>Average Search Steps / Allocation</strong></td>
                    <td style="text-align: right; color: var(--primary-indigo); font-weight: 700;">${f.avgSearchSteps} ${f.avgSearchSteps === minSearch ? '<span class="badge-winner">FASTEST</span>' : ''}</td>
                    <td style="text-align: right; color: var(--primary-indigo); font-weight: 700;">${b.avgSearchSteps} ${b.avgSearchSteps === minSearch ? '<span class="badge-winner">FASTEST</span>' : ''}</td>
                    <td style="text-align: right; color: var(--primary-indigo); font-weight: 700;">${w.avgSearchSteps} ${w.avgSearchSteps === minSearch ? '<span class="badge-winner">FASTEST</span>' : ''}</td>
                    <td style="text-align: right; color: var(--primary-indigo); font-weight: 700;">${n.avgSearchSteps} ${n.avgSearchSteps === minSearch ? '<span class="badge-winner">FASTEST</span>' : ''}</td>
                  </tr>
                  <tr>
                    <td><strong>Fragmentation Failures</strong></td>
                    <td style="text-align: right; color: ${f.fragFailures > 0 ? 'var(--accent-rose)' : 'var(--accent-emerald)'}; font-weight: 700;">${f.fragFailures}</td>
                    <td style="text-align: right; color: ${b.fragFailures > 0 ? 'var(--accent-rose)' : 'var(--accent-emerald)'}; font-weight: 700;">${b.fragFailures}</td>
                    <td style="text-align: right; color: ${w.fragFailures > 0 ? 'var(--accent-rose)' : 'var(--accent-emerald)'}; font-weight: 700;">${w.fragFailures}</td>
                    <td style="text-align: right; color: ${n.fragFailures > 0 ? 'var(--accent-rose)' : 'var(--accent-emerald)'}; font-weight: 700;">${n.fragFailures}</td>
                  </tr>
                  <tr>
                    <td><strong>Compaction Performed?</strong></td>
                    <td style="text-align: right; color: var(--text-muted);">NO (Benchmark)</td>
                    <td style="text-align: right; color: var(--text-muted);">NO (Benchmark)</td>
                    <td style="text-align: right; color: var(--text-muted);">NO (Benchmark)</td>
                    <td style="text-align: right; color: var(--text-muted);">NO (Benchmark)</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <!-- Comparative Charts Section -->
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px;">
            <!-- RAM Utilization Chart -->
            <div class="card">
              <div class="card-title"><span>RAM Utilization % Chart</span></div>
              <div class="chart-bar-container">
                ${[
                  { label: 'First Fit', val: f.utilizationPct, color: 'var(--primary-cyan)' },
                  { label: 'Best Fit', val: b.utilizationPct, color: 'var(--accent-emerald)' },
                  { label: 'Worst Fit', val: w.utilizationPct, color: 'var(--accent-rose)' },
                  { label: 'Next Fit', val: n.utilizationPct, color: 'var(--primary-indigo)' }
                ].map(item => `
                  <div class="chart-row">
                    <span class="chart-label">${item.label}:</span>
                    <div class="chart-bar-bg">
                      <div class="chart-bar-fill" style="width: ${item.val}%; background-color: ${item.color};"></div>
                    </div>
                    <span class="chart-val" style="color: ${item.color};">${item.val}%</span>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Average Search Steps / Allocation Chart -->
            <div class="card">
              <div class="card-title"><span>Average Search Steps / Alloc Chart</span></div>
              <div class="chart-bar-container">
                ${[
                  { label: 'First Fit', val: f.avgSearchSteps, color: 'var(--primary-cyan)' },
                  { label: 'Best Fit', val: b.avgSearchSteps, color: 'var(--accent-emerald)' },
                  { label: 'Worst Fit', val: w.avgSearchSteps, color: 'var(--accent-rose)' },
                  { label: 'Next Fit', val: n.avgSearchSteps, color: 'var(--primary-indigo)' }
                ].map(item => {
                  const maxSearchVal = Math.max(f.avgSearchSteps, b.avgSearchSteps, w.avgSearchSteps, n.avgSearchSteps, 1);
                  const pct = (item.val / maxSearchVal) * 100;
                  return `
                    <div class="chart-row">
                      <span class="chart-label">${item.label}:</span>
                      <div class="chart-bar-bg">
                        <div class="chart-bar-fill" style="width: ${pct}%; background-color: ${item.color};"></div>
                      </div>
                      <span class="chart-val" style="color: ${item.color};">${item.val}</span>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- External Fragmentation (KB) Chart -->
            <div class="card">
              <div class="card-title"><span>External Fragmentation (KB) Chart</span></div>
              <div class="chart-bar-container">
                ${[
                  { label: 'First Fit', val: f.externalFrag, color: 'var(--accent-amber)' },
                  { label: 'Best Fit', val: b.externalFrag, color: 'var(--accent-emerald)' },
                  { label: 'Worst Fit', val: w.externalFrag, color: 'var(--accent-rose)' },
                  { label: 'Next Fit', val: n.externalFrag, color: 'var(--primary-indigo)' }
                ].map(item => {
                  const maxFrag = Math.max(f.externalFrag, b.externalFrag, w.externalFrag, n.externalFrag, 1);
                  const pct = (item.val / maxFrag) * 100;
                  return `
                    <div class="chart-row">
                      <span class="chart-label">${item.label}:</span>
                      <div class="chart-bar-bg">
                        <div class="chart-bar-fill" style="width: ${pct}%; background-color: ${item.color};"></div>
                      </div>
                      <span class="chart-val" style="color: ${item.color};">${item.val} KB</span>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </div>

          <!-- Real Execution Search Trace Drawer -->
          <div class="card">
            <div class="card-title">
              <span>Real Algorithm Search Trace Log (Independent Inspection Console)</span>
              <div style="display: flex; gap: 4px; flex-wrap: wrap;">
                ${['first', 'best', 'worst', 'next'].map(algo => `
                  <button class="btn" style="padding: 4px 10px; font-size: 10px; ${state.benchmarkActiveTraceAlgo === algo ? 'background: var(--primary-cyan); color: #020617; border-color: var(--primary-cyan); font-weight: 800;' : ''}" onclick="state.benchmarkActiveTraceAlgo = '${algo}'; renderApp();">
                    ${algo.toUpperCase()} FIT TRACE
                  </button>
                `).join('')}
              </div>
            </div>

            <div class="console-log" style="height: 220px;">
              ${bData[state.benchmarkActiveTraceAlgo].traceLogs.map(l => {
                let color = '#94a3b8';
                if (l.includes('[SUCCESS]')) color = '#10b981';
                if (l.includes('🚨') || l.includes('[FAILED]') || l.includes('⚠')) color = '#f43f5e';
                if (l.includes('[SEARCH]') || l.includes('===')) color = '#38bdf8';
                if (l.includes('[SELECT]')) color = '#f59e0b';
                return `<div style="color: ${color};">${l}</div>`;
              }).join('')}
            </div>
          </div>
        `;
      }

      // ===================================
      // VIEW C: EXPERIMENT MODE (7 LABS)
      // ===================================
      else if (state.activeTab === 'experiments') {
        const currentExp = LAB_EXPERIMENTS[state.selectedExpIndex];
        viewport.innerHTML = `
          <div style="display: grid; grid-template-columns: 320px 1fr; gap: 24px;">
            <!-- Left Experiments List -->
            <div class="card" style="padding: 16px;">
              <div class="card-title">
                <span>OS Laboratory Experiments (7)</span>
                <span class="badge-tag">LAB LIST</span>
              </div>
              <div style="display: flex; flex-direction: column; gap: 6px;">
                ${LAB_EXPERIMENTS.map((exp, idx) => `
                  <button onclick="state.selectedExpIndex = ${idx}; renderApp();" style="text-align: left; padding: 10px 12px; border-radius: 8px; border: 1px solid ${state.selectedExpIndex === idx ? 'var(--primary-cyan)' : '#1e293b'}; background: ${state.selectedExpIndex === idx ? 'rgba(6, 182, 212, 0.1)' : '#020617'}; color: ${state.selectedExpIndex === idx ? 'var(--primary-cyan)' : '#cbd5e1'}; font-size: 11px; font-weight: 700; cursor: pointer; transition: all 0.2s;">
                    ${exp.title}
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- Right Experiment Details -->
            <div style="display: flex; flex-direction: column; gap: 24px;">
              <div class="card">
                <div class="card-title">
                  <span>${currentExp.title}</span>
                  <div style="display: flex; gap: 8px;">
                    <button class="btn btn-cyan btn-sm" onclick="loadExperiment(${state.selectedExpIndex}, true)">▶ Run Experiment in Simulator</button>
                    <button class="btn btn-sm" onclick="loadExperiment(${state.selectedExpIndex}, false)">Set Up Simulator</button>
                  </div>
                </div>

                <div style="display: flex; flex-direction: column; gap: 14px; font-size: 12px;">
                  <div>
                    <strong style="color: var(--primary-cyan); text-transform: uppercase; font-size: 11px;">Objective:</strong>
                    <p style="color: #cbd5e1; margin-top: 2px;">${currentExp.objective}</p>
                  </div>

                  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px;">
                    <div style="background: #020617; border: 1px solid #1e293b; border-radius: 8px; padding: 8px 12px;">
                      <span style="font-size: 10px; color: var(--text-muted); text-transform: uppercase;">Scheme:</span>
                      <div style="font-weight: 700; color: white;">${currentExp.scheme.toUpperCase()}</div>
                    </div>
                    <div style="background: #020617; border: 1px solid #1e293b; border-radius: 8px; padding: 8px 12px;">
                      <span style="font-size: 10px; color: var(--text-muted); text-transform: uppercase;">Algorithm:</span>
                      <div style="font-weight: 700; color: white;">${currentExp.algorithm.toUpperCase()} FIT</div>
                    </div>
                  </div>

                  <div>
                    <strong style="color: var(--accent-amber); text-transform: uppercase; font-size: 11px;">Workload Actions:</strong>
                    <div style="margin-top: 6px; border: 1px solid #1e293b; border-radius: 8px; overflow: hidden;">
                      <table>
                        <thead>
                          <tr>
                            <th>Step</th>
                            <th>Action Type</th>
                            <th>Process ID</th>
                            <th>Size (KB)</th>
                          </tr>
                        </thead>
                        <tbody>
                          ${currentExp.actions.map((act, i) => `
                            <tr>
                              <td>Step ${i + 1}</td>
                              <td style="color: ${act.type === 'allocate' ? 'var(--accent-emerald)' : act.type === 'deallocate' ? 'var(--accent-rose)' : 'var(--accent-amber)'}; font-weight: 700;">${act.type.toUpperCase()}</td>
                              <td>${act.id}</td>
                              <td>${act.size ? act.size + ' KB' : '—'}</td>
                            </tr>
                          `).join('')}
                        </tbody>
                      </table>
                    </div>
                  </div>

                  <div style="background: rgba(6, 182, 212, 0.08); border: 1px solid rgba(6, 182, 212, 0.3); border-radius: 10px; padding: 12px;">
                    <strong style="color: var(--primary-cyan); font-size: 11px; text-transform: uppercase;">Expected Academic Concept:</strong>
                    <p style="color: #e2e8f0; margin-top: 2px;">${currentExp.expectedConcept}</p>
                  </div>

                  <div style="background: rgba(245, 158, 11, 0.08); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 10px; padding: 12px;">
                    <strong style="color: var(--accent-amber); font-size: 11px; text-transform: uppercase;">Observed Behavior:</strong>
                    <p style="color: #e2e8f0; margin-top: 2px;">${currentExp.observation}</p>
                  </div>

                  <div style="background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 10px; padding: 12px;">
                    <strong style="color: var(--accent-emerald); font-size: 11px; text-transform: uppercase;">Laboratory Conclusion:</strong>
                    <p style="color: #e2e8f0; margin-top: 2px;">${currentExp.conclusion}</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }
    }

    // --- 7. INITIAL BOOTSTRAP ---
    initMemory();
    renderApp();
  </script>
</body>
</html>
